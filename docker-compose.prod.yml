# ==============================================================================
# SHORT STUDIO SERVER - CLIENT / PRODUCTION COMPOSE
# ==============================================================================
# This is the file a customer installation runs. It never builds from source:
# every service references an immutable, published image, so installing and
# updating are a pull rather than a multi-gigabyte compile on the customer's
# machine.
#
#   SHORT_STUDIO_IMAGE     the released application image, pinned by digest by
#                          the updater (ghcr.io/3bud-zc/short-studio-server@sha256:...)
#   SHORT_STUDIO_DATA_DIR  the persistent data directory on the host. It lives
#                          outside every release directory, so upgrading the
#                          code never touches videos, uploads, brands or backups.
#
# Every SHORT_STUDIO_* identity variable below falls back to the legacy ABUD_*
# name when unset, so a .env carried forward from an ABUD Shorts Engine 2.4
# installation keeps working unchanged. A fresh Short Studio install only ever
# sets the SHORT_STUDIO_* names - see .env.example.
#
# Developers keep using docker-compose.v2.yml, which builds from the working
# tree. Nothing here replaces that.
# ==============================================================================

services:
  abud-shorts-postgres:
    # Pinned to an exact patch release. A floating tag would let an unrelated
    # PostgreSQL upgrade ride along with an application update.
    image: postgres:16.10-alpine
    container_name: ${SHORT_STUDIO_CONTAINER_PREFIX:-${ABUD_CONTAINER_PREFIX:-short-studio}}-postgres
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      # Fresh installs get short_studio; an installation upgraded from ABUD
      # Shorts Engine 2.4 has these already set explicitly in its .env to the
      # database's real existing name/owner, which always wins over this default.
      POSTGRES_DB: ${POSTGRES_DB:-short_studio}
      POSTGRES_USER: ${POSTGRES_USER:-short_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set by the installer}
    volumes:
      # A named volume, never removed by the updater and never subject to
      # `down -v` in any normal path. The external volume name is pinned via
      # `name:` below so an upgraded install can reattach to its existing
      # abud-shorts-postgres-data volume instead of a new empty one.
      - abud-shorts-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      abud-shorts-v2:
        aliases:
          - postgres

  abud-shorts-n8n:
    # Pinned. n8n changes workflow semantics between minor versions, so a
    # floating tag could break the control plane without any Short Studio release.
    image: n8nio/n8n:1.76.1
    container_name: ${SHORT_STUDIO_CONTAINER_PREFIX:-${ABUD_CONTAINER_PREFIX:-short-studio}}-n8n
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set by the installer}
      N8N_USER_MANAGEMENT_DISABLED: "true"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Africa/Cairo}
    volumes:
      # External volume name pinned via `name:` below - see the postgres note above.
      - abud-shorts-n8n-data:/home/node/.n8n
      - ${SHORT_STUDIO_RELEASE_DIR:-${ABUD_RELEASE_DIR:-.}}/integrations/n8n:/workflows:ro
    entrypoint: [ "/bin/sh", "-c" ]
    # n8n 1.76's import:workflow reads the file and calls .map() on it, so a
    # single-workflow object fails with "workflows.map is not a function" and a
    # fresh installation ends up with no control plane at all - every video job
    # then dies on a 404 from the orchestration webhook. The two files stay
    # single objects because that is the shape the n8n editor imports and
    # exports, so they are concatenated into one JSON array here instead.
    # publish:workflow does not exist in this version and only logged an error.
    command: >
      "printf '[' > /tmp/short-studio-workflows.json; cat /workflows/abud-shorts-v2-control-plane-workflow.json >> /tmp/short-studio-workflows.json; printf ',' >> /tmp/short-studio-workflows.json; cat /workflows/abud-shorts-v2-publishing-workflow.json >> /tmp/short-studio-workflows.json; printf ']' >> /tmp/short-studio-workflows.json; n8n import:workflow --input=/tmp/short-studio-workflows.json || true; n8n update:workflow --id=abud-shorts-v2-control-plane --active=true || true; n8n update:workflow --id=abud-shorts-v2-publishing --active=true || true; n8n start"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      abud-shorts-v2:
        aliases:
          - n8n

  # Local Voice (VoiceTut/KemeTone) is host-native, not containerized: it needs
  # real NVIDIA/CUDA access, which Docker Desktop for Windows does not reliably
  # pass through for arbitrary consumer GPUs. install.ps1 and
  # scripts\host\short-studio.ps1's `local-voice` command run it directly on
  # the Windows host (see scripts\host\local-voice-lib.ps1) and the app/
  # render-worker below reach it over host.docker.internal. A previous
  # revision of this file defined a containerized abud-shorts-local-tts
  # service with a hard `driver: nvidia` device reservation and a hard
  # depends_on from app/render-worker - that made a from-scratch customer
  # install fail outright on any machine without NVIDIA Container Toolkit
  # configured, since the service could never start and both dependents
  # would wait on it forever. Removed; nothing here ever ran real inference
  # (its own Dockerfile has no torch/voicetut_tts either).

  # The render worker and the application are the same immutable image running
  # in two roles, which is what SERVICE_ROLE already selects. One image to pull,
  # one digest to verify, one thing to roll back.
  abud-shorts-render-worker:
    image: ${SHORT_STUDIO_IMAGE:-${ABUD_IMAGE:?SHORT_STUDIO_IMAGE (or legacy ABUD_IMAGE) must be set by the installer or updater}}
    container_name: ${SHORT_STUDIO_CONTAINER_PREFIX:-${ABUD_CONTAINER_PREFIX:-short-studio}}-render-worker
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      SERVICE_ROLE: render-worker
      V2_ENABLED: "true"
      PORT: 3125
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-45000}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-10000}
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-536870912}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set by the installer}
      PROVIDER_VAULT_MASTER_KEY: ${PROVIDER_VAULT_MASTER_KEY:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-short_studio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-short_studio}
      DATA_DIR_PATH: /app/data
      ABUD_HOST_DEVICE_FINGERPRINT: ${ABUD_HOST_DEVICE_FINGERPRINT:?ABUD_HOST_DEVICE_FINGERPRINT must be set by the installer}
      ABUD_LICENSE_PATH: ${ABUD_LICENSE_PATH:-/app/data/license.json}
      DOCKER: "true"
      DEV: "false"
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      KOKORO_MODEL_PRECISION: ${KOKORO_MODEL_PRECISION:-q4}
      # Kokoro model artifacts are baked into the image at build time
      # (model_q4.onnx under the transformers cache). Force offline mode so a
      # first-call synthesis never requires a network fetch to HuggingFace;
      # without this the transformers runtime revalidates the cache online and
      # fails on machines without connectivity to huggingface.co.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b-q4_K_M}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-45000}
      # OpenCLIP semantic media matching. Fail-closed: when the quality
      # Python runtime (/opt/pyruntime) or the local checkpoint is absent the
      # worker degrades to perceptual-hash-only ranking, so enabling this
      # never blocks a render. The installer provisions the checkpoint under
      # the shared data dir and mounts it at /models/openclip.
      ABUD_ENABLE_OPENCLIP_SEMANTICS: ${ABUD_ENABLE_OPENCLIP_SEMANTICS:-true}
      ABUD_OPENCLIP_MODEL_NAME: ${ABUD_OPENCLIP_MODEL_NAME:-ViT-B-32}
      ABUD_OPENCLIP_LOCAL_WEIGHTS: ${ABUD_OPENCLIP_LOCAL_WEIGHTS:-/models/openclip/ViT-B-32-openclip-state.pt}
      ABUD_OPENCLIP_PYTHON_BIN: ${ABUD_OPENCLIP_PYTHON_BIN:-/opt/pyruntime/bin/python}
      ABUD_OPENCLIP_WORKER_POOL_SIZE: ${ABUD_OPENCLIP_WORKER_POOL_SIZE:-2}
      # Local Voice (VoiceTut/KemeTone) is the default Arabic route and runs
      # host-native on Windows (see the note above short-studio-render-worker);
      # host.docker.internal is how a container reaches it. ElevenLabs is an
      # optional premium alternative, configured from the app UI and held
      # encrypted in the provider vault - never a silent fallback.
      # The fallback port is deliberately unreachable (9 = discard): the
      # installer always writes the resolved per-install port into .env, and
      # a missing value must fail fast rather than silently alias whatever
      # Local Voice another installation happens to run on this host's 8765.
      LOCAL_TTS_BASE_URL: ${LOCAL_TTS_BASE_URL:-http://host.docker.internal:9}
      LOCAL_TTS_SYNTHESIS_TIMEOUT_MS: ${LOCAL_TTS_SYNTHESIS_TIMEOUT_MS:-300000}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_DEFAULT_VOICE_ID: ${ELEVENLABS_DEFAULT_VOICE_ID:-}
      CONCURRENCY: ${CONCURRENCY:-1}
      VIDEO_CACHE_SIZE_IN_BYTES: ${VIDEO_CACHE_SIZE_IN_BYTES:-2097152000}
    volumes:
      - ${SHORT_STUDIO_DATA_DIR:-${ABUD_DATA_DIR:?SHORT_STUDIO_DATA_DIR (or legacy ABUD_DATA_DIR) must be set by the installer}}:/app/data
      # LocalModelManager checks Local Voice model readiness from this
      # filesystem view (metadata.json), not from a live call to the
      # host-native service, so this must be the same physical directory
      # install.ps1's Local Voice setup writes the model cache into.
      - ${SHORT_STUDIO_DATA_DIR:-${ABUD_DATA_DIR:?SHORT_STUDIO_DATA_DIR (or legacy ABUD_DATA_DIR) must be set by the installer}}/models:/models
    # The bootstrap copy is a fast path, not a hard requirement: `|| true`
    # and the trailing `;` (not `&&`) before `node dist/index.js` mean a
    # failed or missing bootstrap seed never prevents the app from starting
    # - Whisper.ts's own init() self-heals by downloading whisper.cpp and
    # the model over the network when /app/data/libs/whisper isn't already
    # populated correctly, which is exactly what must happen on a fresh
    # install if this seed step is ever broken again.
    entrypoint: [ "sh", "-c", "if [ ! -f /app/data/libs/whisper/models/ggml-small.bin ]; then rm -rf /app/data/libs/whisper && mkdir -p /app/data/libs && cp -R /app/bootstrap/whisper /app/data/libs/whisper || true; fi; if [ ! -f /models/openclip/ViT-B-32-openclip-state.pt ] && [ -f /app/bootstrap/openclip/ViT-B-32-openclip-state.pt ]; then mkdir -p /models/openclip && cp /app/bootstrap/openclip/ViT-B-32-openclip-state.pt /models/openclip/ || true; fi; node dist/index.js" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:3125/health >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20
    extra_hosts:
      # Docker Desktop for Windows already resolves this; explicit on native
      # Linux Docker Engine (>=20.10), which also loads this same compose file.
      - "host.docker.internal:host-gateway"
    networks:
      abud-shorts-v2:
        aliases:
          - render-worker

  abud-shorts-app:
    image: ${SHORT_STUDIO_IMAGE:-${ABUD_IMAGE:?SHORT_STUDIO_IMAGE (or legacy ABUD_IMAGE) must be set by the installer or updater}}
    container_name: ${SHORT_STUDIO_CONTAINER_PREFIX:-${ABUD_CONTAINER_PREFIX:-short-studio}}-app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      abud-shorts-postgres:
        condition: service_healthy
      abud-shorts-n8n:
        condition: service_started
      abud-shorts-render-worker:
        condition: service_started
    environment:
      SERVICE_ROLE: app
      V2_ENABLED: "true"
      PORT: 3123
      # Local Voice is host-native (see the note above short-studio-render-worker)
      # and is never a hard startup dependency: if it is not installed or not
      # reachable, Arabic jobs report Local Voice setup is required instead of
      # blocking the whole application from starting. Port 9 is deliberately
      # unreachable - see the matching note on the app service above; the real
      # per-install port always comes from the installer's generated .env.
      LOCAL_TTS_BASE_URL: ${LOCAL_TTS_BASE_URL:-http://host.docker.internal:9}
      LOCAL_TTS_SYNTHESIS_TIMEOUT_MS: ${LOCAL_TTS_SYNTHESIS_TIMEOUT_MS:-300000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-45000}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-10000}
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-536870912}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set by the installer}
      PROVIDER_VAULT_MASTER_KEY: ${PROVIDER_VAULT_MASTER_KEY:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-short_studio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-short_studio}
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_PATH: /webhook/abud-v2/jobs/start
      RENDER_WORKER_BASE_URL: http://render-worker:3125
      APP_INTERNAL_BASE_URL: http://app:3123
      # The address customers reach this installation on. Set by the installer
      # and editable from Settings; every OAuth callback URL derives from it.
      V2_PUBLIC_URL: ${V2_PUBLIC_URL:-http://localhost:3130}
      HOST_PORT: ${HOST_PORT:-3130}
      SHORT_STUDIO_ACCESS_MODE: ${SHORT_STUDIO_ACCESS_MODE:-local}
      SHORT_STUDIO_PUBLIC_BIND_HOST: ${SHORT_STUDIO_PUBLIC_BIND_HOST:-127.0.0.1}
      # Unset means forwarded headers are ignored. Set to 1 (or a CIDR list)
      # only when nginx or Cloudflare really is in front.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      SHORT_STUDIO_RELEASE_CHANNEL: ${SHORT_STUDIO_RELEASE_CHANNEL:-${ABUD_RELEASE_CHANNEL:-stable}}
      SHORT_STUDIO_HOST_PLATFORM: ${SHORT_STUDIO_HOST_PLATFORM:-${ABUD_HOST_PLATFORM:-linux}}
      SHORT_STUDIO_INSTALL_TYPE: ${SHORT_STUDIO_INSTALL_TYPE:-${ABUD_INSTALL_TYPE:-docker_linux}}
      SHORT_STUDIO_UPDATE_MANIFEST_URL: ${SHORT_STUDIO_UPDATE_MANIFEST_URL:-${ABUD_UPDATE_MANIFEST_URL:-}}
      DATA_DIR_PATH: /app/data
      ABUD_HOST_DEVICE_FINGERPRINT: ${ABUD_HOST_DEVICE_FINGERPRINT:?ABUD_HOST_DEVICE_FINGERPRINT must be set by the installer}
      ABUD_LICENSE_PATH: ${ABUD_LICENSE_PATH:-/app/data/license.json}
      DOCKER: "true"
      DEV: "false"
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      KOKORO_MODEL_PRECISION: ${KOKORO_MODEL_PRECISION:-q4}
      # Kokoro model artifacts are baked into the image at build time
      # (model_q4.onnx under the transformers cache). Force offline mode so a
      # first-call synthesis never requires a network fetch to HuggingFace;
      # without this the transformers runtime revalidates the cache online and
      # fails on machines without connectivity to huggingface.co.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b-q4_K_M}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-45000}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_DEFAULT_VOICE_ID: ${ELEVENLABS_DEFAULT_VOICE_ID:-}
      CONCURRENCY: ${CONCURRENCY:-1}
      VIDEO_CACHE_SIZE_IN_BYTES: ${VIDEO_CACHE_SIZE_IN_BYTES:-2097152000}
    ports:
      # Only the application is published. PostgreSQL, n8n and the render worker
      # stay on the internal network with no host port at all. Local mode binds
      # the customer-facing app to loopback so it is not exposed on the LAN.
      - "127.0.0.1:${HOST_PORT:-3130}:3123"
    volumes:
      - ${SHORT_STUDIO_DATA_DIR:-${ABUD_DATA_DIR:?SHORT_STUDIO_DATA_DIR (or legacy ABUD_DATA_DIR) must be set by the installer}}:/app/data
      # Same physical directory as render-worker's /models mount - see the
      # comment there.
      - ${SHORT_STUDIO_DATA_DIR:-${ABUD_DATA_DIR:?SHORT_STUDIO_DATA_DIR (or legacy ABUD_DATA_DIR) must be set by the installer}}/models:/models
    # The bootstrap copy is a fast path, not a hard requirement: `|| true`
    # and the trailing `;` (not `&&`) before `node dist/index.js` mean a
    # failed or missing bootstrap seed never prevents the app from starting
    # - Whisper.ts's own init() self-heals by downloading whisper.cpp and
    # the model over the network when /app/data/libs/whisper isn't already
    # populated correctly, which is exactly what must happen on a fresh
    # install if this seed step is ever broken again.
    entrypoint: [ "sh", "-c", "if [ ! -f /app/data/libs/whisper/models/ggml-small.bin ]; then rm -rf /app/data/libs/whisper && mkdir -p /app/data/libs && cp -R /app/bootstrap/whisper /app/data/libs/whisper || true; fi; if [ ! -f /models/openclip/ViT-B-32-openclip-state.pt ] && [ -f /app/bootstrap/openclip/ViT-B-32-openclip-state.pt ]; then mkdir -p /models/openclip && cp /app/bootstrap/openclip/ViT-B-32-openclip-state.pt /models/openclip/ || true; fi; node dist/index.js" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:3123/health >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      abud-shorts-v2:
        aliases:
          - app

volumes:
  # `name:` pins the real external Docker volume name. Fresh installs get
  # short-studio-*-data. An installation upgraded from ABUD Shorts Engine 2.4
  # must have its installer/updater set SHORT_STUDIO_POSTGRES_VOLUME and
  # SHORT_STUDIO_N8N_VOLUME (or the legacy ABUD_POSTGRES_VOLUME /
  # ABUD_N8N_VOLUME) to its real existing volume names - the pre-2.5 compose
  # file never set `name:` here, so Docker Compose's own default naming
  # applies: "<compose project name>_abud-shorts-postgres-data" and
  # "<compose project name>_abud-shorts-n8n-data", NOT the bare key. Getting
  # this wrong reattaches to nothing and `docker compose up` silently creates
  # empty new volumes instead - this is the single highest-risk spot in the
  # whole migration and must never be left to the bare default. install.ps1
  # computes and writes the correct prefixed name for a detected legacy
  # installation; see the comment there for the reasoning.
  abud-shorts-postgres-data:
    name: ${SHORT_STUDIO_POSTGRES_VOLUME:-${ABUD_POSTGRES_VOLUME:-short-studio-postgres-data}}
  abud-shorts-n8n-data:
    name: ${SHORT_STUDIO_N8N_VOLUME:-${ABUD_N8N_VOLUME:-short-studio-n8n-data}}

networks:
  abud-shorts-v2:
    name: ${SHORT_STUDIO_NETWORK:-${ABUD_NETWORK:-short-studio-v2}}
    driver: bridge
