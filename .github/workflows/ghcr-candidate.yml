# ==============================================================================
# ABUD Shorts Engine - GHCR candidate image workflow
# ==============================================================================
# Manual-only candidate gate. It uses the repository GITHUB_TOKEN with package
# write permission, publishes only sha-<commit> candidate tags, and can later
# promote an already accepted digest onto the version and stable tags without
# rebuilding application bytes.
#
# The workflow checks that package.json and src/version.ts agree on
# PRODUCT_VERSION, so the same gate serves every release candidate. Candidate
# mode accepts a pre-release version (2.4.0-rc.2, 2.4.0-beta.1, ...) as well
# as a plain one, since it publishes nothing but a sha-<commit> tag - it
# never creates a Git tag or a GitHub Release and never moves the version or
# stable tag. promote/retag-stable move real customer-facing tags, so both
# require a plain stable version (X.Y.Z) and are refused for a pre-release,
# even if candidate mode already built one - promotion happens only after
# the release is approved.
#
# retag-stable mode moves ONLY the mutable :stable channel pointer onto an
# already-published digest. It never touches the immutable :version tag, never
# rebuilds application bytes, and never creates a Git tag or a Release. It
# exists so the stable channel can be reconciled to a canonical release digest
# without going through promote (which would also move :version).
# ==============================================================================

name: GHCR Candidate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full commit SHA that this run must build or promote"
        required: true
        type: string
      source_ref:
        description: "Git ref to check out before building or promoting"
        required: true
        default: v2.3-product-overhaul
        type: string
      mode:
        description: "Build a candidate, promote an accepted digest, or move only :stable"
        required: true
        default: candidate
        type: choice
        options: [candidate, promote, retag-stable]
      digest:
        description: "Accepted image digest for promote / retag-stable mode, sha256:<64 hex>"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Resolve candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ inputs.expected_sha }}"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::This workflow resolved $ACTUAL_SHA, not the requested $EXPECTED_SHA."
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          SOURCE_VERSION="$(grep -oP 'PRODUCT_VERSION\s*=\s*"\K[^"]+' src/version.ts)"
          SCHEMA_VERSION="$(grep -oP 'DATABASE_SCHEMA_VERSION\s*=\s*"\K[^"]+' src/version.ts)"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json is $VERSION but src/version.ts is $SOURCE_VERSION."
            exit 1
          fi
          # Same pattern scripts/release/package-client.mjs already validates
          # client package versions against: MAJOR.MINOR.PATCH, optionally
          # with a pre-release suffix (-rc.2, -beta.1, ...).
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::PRODUCT_VERSION $VERSION is not a valid semantic version."
            exit 1
          fi
          # Only candidate mode may build a pre-release: it publishes nothing
          # but a sha-<commit> tag. promote/retag-stable move :stable (and
          # promote also creates the immutable :<version> tag), so both
          # require a plain, already-released stable version - never a
          # pre-release riding onto either.
          if [ "${{ inputs.mode }}" != "candidate" ] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${{ inputs.mode }} mode requires a plain stable version (X.Y.Z); PRODUCT_VERSION is a pre-release ($VERSION). Only candidate mode may run against a pre-release."
            exit 1
          fi

          IMAGE_NAME="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${ACTUAL_SHA:0:7}"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "sha=$ACTUAL_SHA"
            echo "short_sha=$SHORT_SHA"
            echo "tag=sha-$SHORT_SHA"
            echo "version=$VERSION"
            echo "schema=$SCHEMA_VERSION"
            echo "image=${{ env.REGISTRY }}/$IMAGE_NAME"
            echo "source=${{ github.server_url }}/${{ github.repository }}"
            echo "created=$CREATED"
          } >> "$GITHUB_OUTPUT"

      - name: Validate digest input
        if: inputs.mode != 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${{ inputs.digest }}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::${{ inputs.mode }} mode requires digest=sha256:<64 hex>."
            exit 1
          fi

      - name: Set up Node
        if: inputs.mode == 'candidate'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        if: inputs.mode == 'candidate'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        if: inputs.mode == 'candidate'
        run: pnpm install --frozen-lockfile

      - name: Set up the CPU quality runtime the test suite shells out to
        if: inputs.mode == 'candidate'
        run: bash scripts/install-quality-pack.sh

      - name: Typecheck, test and build
        if: inputs.mode == 'candidate'
        run: |
          pnpm typecheck
          pnpm vitest run
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v2.Dockerfile builds every layer it needs, so the candidate image
      # comes out of one build with no separate base tag to stay in step with.
      - name: Build and push candidate image
        id: push
        if: inputs.mode == 'candidate'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.tag }}"
          docker buildx build \
            --platform linux/amd64 \
            --file v2.Dockerfile \
            --tag "$IMAGE" \
            --label "org.opencontainers.image.title=ABUD Shorts Engine" \
            --label "org.opencontainers.image.description=Client-installed short-video production system" \
            --label "org.opencontainers.image.version=${{ steps.identity.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ steps.identity.outputs.sha }}" \
            --label "org.opencontainers.image.source=${{ steps.identity.outputs.source }}" \
            --label "org.opencontainers.image.created=${{ steps.identity.outputs.created }}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --push \
            .

      - name: Resolve pushed candidate digest
        id: digest
        if: inputs.mode == 'candidate'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.tag }}"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" | awk '/^Digest:/ {print $2; exit}')"
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not resolve a valid digest for $IMAGE."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### GHCR candidate"
            echo ""
            echo "- Image: \`${{ steps.identity.outputs.image }}\`"
            echo "- Tag: \`${{ steps.identity.outputs.tag }}\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Revision: \`${{ steps.identity.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Promote accepted digest without rebuild
        if: inputs.mode == 'promote'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.identity.outputs.image }}"
          docker buildx imagetools create \
            --tag "$IMAGE:${{ steps.identity.outputs.version }}" \
            --tag "$IMAGE:stable" \
            "$IMAGE@${{ inputs.digest }}"
          {
            echo "### GHCR promotion"
            echo ""
            echo "- Image: \`$IMAGE\`"
            echo "- Version tag: \`${{ steps.identity.outputs.version }}\`"
            echo "- Stable tag: \`stable\`"
            echo "- Digest: \`${{ inputs.digest }}\`"
            echo "- Revision: \`${{ steps.identity.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Moves ONLY the :stable channel pointer. The :version tag is immutable
      # once a release is published, so it is never touched here. No rebuild.
      #
      # This re-uploads the exact manifest bytes of the accepted digest under
      # the stable tag, so stable resolves to that identical digest.
      # `imagetools create` is deliberately not used: given a single-platform
      # manifest it wraps it in a fresh index with a new digest, which would
      # leave stable and the version tag pointing at different digests.
      - name: Move only the stable tag without rebuild
        if: inputs.mode == 'retag-stable'
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          ACCEPT="application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json"

          TOKEN="$(curl -fsS -u "$GHCR_ACTOR:$GHCR_PASSWORD" \
            "https://ghcr.io/token?scope=repository:${REPO}:pull,push&service=ghcr.io" | jq -r .token)"

          # The accepted manifest, fetched by digest so the bytes are exact.
          CONTENT_TYPE="$(curl -fsS -o manifest.bin -D - \
            -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" \
            "https://ghcr.io/v2/${REPO}/manifests/${DIGEST}" \
            | tr -d '\r' | awk 'tolower($1)=="content-type:"{print $2}')"
          echo "source manifest content-type: $CONTENT_TYPE"

          # Re-tag: PUT the identical bytes under :stable. The registry derives
          # the digest from the bytes, so stable == the accepted digest.
          curl -fsS -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: $CONTENT_TYPE" \
            --data-binary @manifest.bin \
            "https://ghcr.io/v2/${REPO}/manifests/stable"

          RESOLVED="$(curl -fsS -I \
            -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" \
            "https://ghcr.io/v2/${REPO}/manifests/stable" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')"
          if [ "$RESOLVED" != "$DIGEST" ]; then
            echo "::error::stable resolved to $RESOLVED, expected $DIGEST."
            exit 1
          fi
          {
            echo "### GHCR stable retag"
            echo ""
            echo "- Image: \`ghcr.io/${REPO}\`"
            echo "- Stable tag now points at: \`$DIGEST\`"
            echo "- Version tag: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
